    <!--
      GOOGLE FONTS
      Pré-connect: avisa o navegador que vamos baixar fontes do Google,
      para ele preparar a conexão antes mesmo de processar o link da fonte.
      Isso acelera o carregamento das fontes.

      Montserrat: fonte geométrica moderna, usada nos títulos
      Open Sans: fonte humanista legível, usada no texto corrido
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Open+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
